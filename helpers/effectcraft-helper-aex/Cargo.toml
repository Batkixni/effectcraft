[package]
name = "effectcraft-helper-aex"
description = "Out-of-process After Effects plug-in helper for EffectCraft. Loads .aex files with aexlo and answers the JSON-lines protocol in docs/aex.md. A plug-in crash stops this program, not EffectCraft."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.99"

[dependencies]
# Pinned. aexlo is under heavy development; bump the rev on purpose and retest plug-ins.
aexlo = { git = "https://github.com/potistudio/aexlo", rev = "28e9f9a4a371d0ecae0d2b183e167755b3a7cac3" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
